services:
  db:
    image: postgres:15-alpine
    container_name: attendance-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/attendance_db
      - JWT_SECRET=${JWT_SECRET:-aura-attend-cryptographic-hash-jwt-secret-key-99881122}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - FALLBACK_AI_PROVIDER=${FALLBACK_AI_PROVIDER:-}
      - FALLBACK_AI_API_KEY=${FALLBACK_AI_API_KEY:-}
      - FALLBACK_AI_MODEL=${FALLBACK_AI_MODEL:-}
      - NEXT_PUBLIC_MOCK_MODE=${NEXT_PUBLIC_MOCK_MODE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
